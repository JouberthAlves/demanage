name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

# Cancel superseded PR runs only. Master pushes always finish, because the
# production promotion gate needs a successful CI run for that exact SHA.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    # 'backend' is a required master check. Keep the O04 backup/restore
    # regression on its critical path even before it becomes a ruleset check.
    needs: backup-restore
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: demanage
          POSTGRES_PASSWORD: demanage
          POSTGRES_DB: demanage
          TZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U demanage -d demanage"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      TZ: UTC
      DATABASE_URL: postgresql://demanage:demanage@localhost:5432/demanage?schema=public
      # Separate database: the drift check resets its shadow database.
      SHADOW_DATABASE_URL: postgresql://demanage:demanage@localhost:5432/demanage_shadow?schema=public
      JWT_SECRET: ci-secret-not-for-production
      APP_URL: http://localhost:5180
    steps:
      - name: Enforce required O04 backup/restore result
        if: needs.backup-restore.result != 'success'
        run: |
          echo '::error::Real PostgreSQL O04 backup/restore check did not succeed'
          exit 1
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          package-dir: backend
      - name: Audit dependencies
        run: pnpm audit --audit-level moderate
      - name: Validate Prisma schema
        run: pnpm exec prisma validate
      - name: Generate Prisma client
        run: pnpm exec prisma generate
      - name: Typecheck
        run: pnpm typecheck
      - name: Create shadow database
        env:
          PGPASSWORD: demanage
        run: psql -h localhost -U demanage -d demanage -v ON_ERROR_STOP=1 -c 'CREATE DATABASE demanage_shadow'
      # Two migrations already applied in production share 20260821120000. Renaming
      # applied migrations breaks _prisma_migrations, so that one prefix is allowed.
      # See docs/database-migrations.md.
      - name: Check migration timestamps are unique
        run: |
          duplicates=$(ls prisma/migrations | grep -E '^[0-9]{14}_' | cut -c1-14 | sort | uniq -d | grep -v '^20260821120000$' || true)
          if [ -n "$duplicates" ]; then
            echo "::error::Duplicate migration timestamps: $duplicates"
            exit 1
          fi
      - name: Apply migrations
        run: pnpm exec prisma migrate deploy
      # Fails (exit 2) when prisma/migrations does not produce prisma/schema.prisma.
      - name: Migration drift gate
        run: pnpm exec prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --exit-code
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test:unit
      - name: Integration tests
        run: pnpm test:integration
      - name: Build
        run: pnpm build

  backup-restore:
    # O04: exercising backup-db.ps1 against a real but disposable PostgreSQL
    # instance, never a service or volume from the Debian production host.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      CI: 'true'
      DEMANAGE_O04_OWNER: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Start isolated O04 PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          # Name is required by the existing backup script; no port publishing
          # and no shared Docker volumes or networks.
          docker run -d --name demanage-db --network none \
            --label "org.demanage.o04.owner=$DEMANAGE_O04_OWNER" \
            -e POSTGRES_USER=demanage \
            -e POSTGRES_PASSWORD=demanage-o04-only \
            -e POSTGRES_DB=demanage \
            postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
          for attempt in $(seq 1 60); do
            if docker exec demanage-db pg_isready -U demanage -d demanage >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          echo '::error::Disposable O04 PostgreSQL failed its readiness check'
          exit 1
      - name: Real PowerShell pg_dump and pg_restore regression
        shell: pwsh
        run: ./scripts/tests/backup-db.e2e.ps1
      - name: Remove only this job's disposable PostgreSQL
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          owner="$(docker inspect --format '{{ index .Config.Labels "org.demanage.o04.owner" }}' demanage-db 2>/dev/null || true)"
          if [[ "$owner" == "$DEMANAGE_O04_OWNER" ]]; then
            docker rm --force --volumes demanage-db
          elif [[ -n "$owner" ]]; then
            echo '::error::Refusing to remove an O04-unowned container'
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          package-dir: frontend
      - name: Audit dependencies
        run: pnpm audit --audit-level moderate
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  docker-build:
    # Build only (no push). Publishing happens in publish-ghcr.yml after CI succeeds on master.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          platforms: linux/amd64
          push: false
          build-args: ${{ matrix.service == 'frontend' && 'VITE_API_URL=/api' || '' }}
          # Read-only cache: fork PRs cannot write to the Actions cache.
          cache-from: type=gha,scope=demanage-${{ matrix.service }}

  deploy-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.4'
      - name: Install pinned PostgreSQL SQL parser for approval gate
        run: python -m pip install -r ops/cd/requirements-approval.txt
      - name: Compile deploy agent
        run: python -m compileall -q ops/cd
      - name: Run fail-closed deployment tests
        run: python -m unittest discover -s ops/cd/tests -v
