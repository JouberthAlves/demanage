name: Approve production release

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Full 40-character SHA already built and validated on master'
        required: true
        type: string
      initial_live_sha:
        description: 'First release only: verified SHA currently running on the Debian host'
        required: false
        type: string
      reviewed_pr47_backup_sha256:
        description: 'One-time PR47 migration exception only: SHA256 of verified production dump after successful restore/rehearsal'
        required: false
        type: string
      reviewed_issue87_backup_sha256:
        description: 'Issue 87 only: independently verified production backup SHA256; requires human environment approval'
        required: false
        type: string
      reviewed_issue87_rehearsal_sha256:
        description: 'Issue 87 only: SHA256 of fresh private PostgreSQL 31-to-35 rehearsal proof'
        required: false
        type: string

permissions:
  contents: write
  actions: read
  packages: read

concurrency:
  group: demanage-production-approval
  cancel-in-progress: false

jobs:
  promote:
    if: github.ref == 'refs/heads/master' && github.actor == 'bielxdh3'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Configure required reviewers and set PRODUCTION_GATE_CONFIGURED=true
    # in this environment BEFORE the first manual promotion.
    environment:
      name: production
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: ${{ inputs.commit_sha }}
      INITIAL_LIVE_SHA: ${{ inputs.initial_live_sha }}
      REVIEWED_PR47_BACKUP_SHA256: ${{ inputs.reviewed_pr47_backup_sha256 }}
      REVIEWED_ISSUE87_BACKUP_SHA256: ${{ inputs.reviewed_issue87_backup_sha256 }}
      REVIEWED_ISSUE87_REHEARSAL_SHA256: ${{ inputs.reviewed_issue87_rehearsal_sha256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Confirm explicit environment gate
        env:
          GATE_ENABLED: ${{ vars.PRODUCTION_GATE_CONFIGURED }}
        run: |
          set -euo pipefail
          if [[ "$GATE_ENABLED" != true ]]; then
            echo "::error::Configure production required reviewers and PRODUCTION_GATE_CONFIGURED=true before promoting."
            exit 1
          fi
      - name: Verify master ancestry, both passing checks and DB migration safety
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid target SHA"; exit 1; }
          git cat-file -e "$TARGET_SHA^{commit}"
          git merge-base --is-ancestor "$TARGET_SHA" origin/master

          # The app image may be from the earlier merge SHA; the newly merged
          # approval workflow also must have passed hosted CI and CodeQL.
          for check_sha in "$TARGET_SHA" "$GITHUB_SHA"; do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$check_sha&event=push&per_page=100" > "$RUNNER_TEMP/checks-$check_sha.json"
            for workflow in CI CodeQL; do
              jq -e --arg sha "$check_sha" --arg name "$workflow" \
                '[.workflow_runs[] | select(.head_sha == $sha and .event == "push" and .name == $name and .conclusion == "success")] | length > 0' \
                "$RUNNER_TEMP/checks-$check_sha.json" > /dev/null || {
                  echo "::error::$workflow was not successful for exact push SHA $check_sha"
                  exit 1
                }
            done
          done

          if git ls-remote --exit-code --heads origin production > /dev/null; then
            gh api "repos/$GITHUB_REPOSITORY/contents/production.json?ref=production" > "$RUNNER_TEMP/previous.json"
            # GitHub's REST content field includes base64 line breaks; jq's
            # @base64d rejects those on newer runners. GNU base64 accepts them.
            PREVIOUS_SHA="$(jq -r '.content' "$RUNNER_TEMP/previous.json" | base64 --decode | jq -er 'select(.version == 1 or .version == 2) | .source_commit')"
            if [[ -n "$INITIAL_LIVE_SHA" ]]; then
              echo "::error::initial_live_sha must be empty after initialization"
              exit 1
            fi
          else
            PREVIOUS_SHA="$INITIAL_LIVE_SHA"
            [[ "$PREVIOUS_SHA" =~ ^[0-9a-f]{40}$ ]] || {
              echo "::error::First promotion requires the exact currently deployed full SHA"
              exit 1
            }
          fi
          git cat-file -e "$PREVIOUS_SHA^{commit}"
          git merge-base --is-ancestor "$PREVIOUS_SHA" origin/master
          if ! git merge-base --is-ancestor "$PREVIOUS_SHA" "$TARGET_SHA"; then
            echo "::error::Normal production promotion must be a fast-forward from the live release; use a separately reviewed rollback procedure."
            exit 1
          fi
          if [[ -n "$REVIEWED_ISSUE87_BACKUP_SHA256" || -n "$REVIEWED_ISSUE87_REHEARSAL_SHA256" ]]; then
            if [[ "$PREVIOUS_SHA" != 'ec2a3d40a6c8218ab0550258305e1745ee3b1fbc' ||
                  "$TARGET_SHA" != '62e98ccea16dd0d3164ab1689c11fe770b983393' ]]; then
              echo "::error::Issue87 evidence inputs must never be reused on other promotions."
              exit 1
            fi
          fi
          if ! git diff --quiet "$PREVIOUS_SHA" "$TARGET_SHA" -- \
            backend/prisma backend/prisma.config.ts backend/entrypoint.sh docker-compose.prod.yml; then
            # Strictly scoped, single-release exception: this exact SHA was
            # rehearsed against a restored production dump and the live DB must
            # be migrated separately before the deploy agent changes images.
            if [[ "$PREVIOUS_SHA" == '83488ef75d426688fda06feb2333af58c87ad569' &&
                  "$TARGET_SHA" == '1d6377b94d539003a3f0a7c543d91503980a2ba9' &&
                  "$REVIEWED_PR47_BACKUP_SHA256" == '7db1db9c53de1f3aa982cdc514771046db5d9348287af2dad4934f62d5da979b' ]]; then
              echo "::notice::Explicit PR47-only DB migration approval attested by reviewed backup SHA; deployment still requires protected production environment approval."
            elif [[ "$PREVIOUS_SHA" == 'ec2a3d40a6c8218ab0550258305e1745ee3b1fbc' &&
                    "$TARGET_SHA" == '62e98ccea16dd0d3164ab1689c11fe770b983393' &&
                    -n "$REVIEWED_ISSUE87_BACKUP_SHA256" &&
                    -n "$REVIEWED_ISSUE87_REHEARSAL_SHA256" ]]; then
              # Eligibility is NOT approval. Recheck the entire exact Git diff,
              # reviewed proof, expiry and both OCI digests after resolution.
              echo "ISSUE87_IMAGE_CHECK_REQUIRED=1" >> "$GITHUB_ENV"
              echo "::notice::Issue87 exact migration candidate; awaiting immutable OCI verification."
            else
              echo "::error::Migrations, entrypoint or base Compose changed; production promotion blocked. A separate reviewed migration is required."
              exit 1
            fi
          fi
          echo "PREVIOUS_SHA=$PREVIOUS_SHA" >> "$GITHUB_ENV"
      - name: Resolve both images by immutable registry digest
        run: |
          set -euo pipefail
          for service in backend frontend; do
            ref="ghcr.io/$GITHUB_REPOSITORY-$service:sha-$TARGET_SHA"
            digest="$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | jq -er '.digest')"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
            image="ghcr.io/$GITHUB_REPOSITORY-$service@$digest"
            echo "${service^^}_IMAGE=$image" >> "$GITHUB_ENV"
            if [[ "$service" == backend ]]; then
              BACKEND_IMAGE="$image"
            else
              FRONTEND_IMAGE="$image"
            fi
          done
          if [[ "${ISSUE87_IMAGE_CHECK_REQUIRED:-}" == 1 ]]; then
            python3 ops/cd/issue87_release_gate.py \
              --repo . --previous "$PREVIOUS_SHA" --target "$TARGET_SHA" \
              --dump-sha256 "$REVIEWED_ISSUE87_BACKUP_SHA256" \
              --rehearsal-sha256 "$REVIEWED_ISSUE87_REHEARSAL_SHA256" \
              --backend "$BACKEND_IMAGE" --frontend "$FRONTEND_IMAGE"
          fi
      - name: Prepare exact production pointer bytes
        id: prepare
        run: |
          set -euo pipefail
          jq -n \
            --arg commit "$TARGET_SHA" \
            --arg previous "$PREVIOUS_SHA" \
            --arg backend "$BACKEND_IMAGE" \
            --arg frontend "$FRONTEND_IMAGE" \
            --arg reviewer "$GITHUB_ACTOR" \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            '{version:2, source_commit:$commit, previous_commit:$previous, backend:$backend, frontend:$frontend, approved_by:$reviewer, approved_at:$timestamp, approval_run_id:$run_id, approval_run_attempt:$run_attempt}' \
            > "$RUNNER_TEMP/production.json"

          pointer_sha256="$(sha256sum "$RUNNER_TEMP/production.json" | cut -d' ' -f1)"
          [[ "$pointer_sha256" =~ ^[0-9a-f]{64}$ ]] || exit 1
          echo "pointer_sha256=$pointer_sha256" >> "$GITHUB_OUTPUT"

      # Uploaded inside the environment-gated job, before publishing. A failed
      # artifact upload leaves the old pointer intact. v4 artifacts are immutable.
      - name: Witness exact production pointer from approved run
        uses: actions/upload-artifact@v4
        with:
          name: production-pointer-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.prepare.outputs.pointer_sha256 }}
          path: ${{ runner.temp }}/production.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish atomic production pointer (no SSH, no database access)
        run: |
          set -euo pipefail

          blob_sha=''
          if ! git ls-remote --exit-code --heads origin production > /dev/null; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref='refs/heads/production' \
              -f sha="$GITHUB_SHA" > /dev/null
          else
            blob_sha="$(jq -r '.sha' "$RUNNER_TEMP/previous.json")"
          fi

          jq -n \
            --arg message "deploy: approve $TARGET_SHA for production" \
            --arg payload "$(base64 -w0 "$RUNNER_TEMP/production.json")" \
            --arg blob "$blob_sha" \
            '{message:$message, content:$payload, branch:"production"} + (if $blob == "" then {} else {sha:$blob} end)' \
            > "$RUNNER_TEMP/payload.json"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/production.json" \
            --input "$RUNNER_TEMP/payload.json" > "$RUNNER_TEMP/published.json"
          pointer_commit="$(jq -er '.commit.sha' "$RUNNER_TEMP/published.json")"
          pointer_blob="$(jq -er '.content.sha' "$RUNNER_TEMP/published.json")"
          [[ "$pointer_commit" =~ ^[0-9a-f]{40}$ && "$pointer_blob" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::GitHub did not confirm an immutable production pointer commit/blob"
            exit 1
          }
          [[ "$(git hash-object "$RUNNER_TEMP/production.json")" == "$pointer_blob" ]] || {
            echo "::error::Published production pointer blob differs from approved payload"
            exit 1
          }
          {
            echo "## Production approved"
            echo "- Commit: \`$TARGET_SHA\`"
            echo "- Previous: \`$PREVIOUS_SHA\`"
            echo "- Backend: \`$BACKEND_IMAGE\`"
            echo "- Frontend: \`$FRONTEND_IMAGE\`"
            echo ""
            echo "The Debian polling service will apply this release once provisioned."
          } >> "$GITHUB_STEP_SUMMARY"
