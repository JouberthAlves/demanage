name: Bug report
description: Report a reproducible deManage problem
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Remove JWTs, cookies, recovery codes, credentials, database content,
        environment values, and personal financial data before submitting.

  - type: input
    id: revision
    attributes:
      label: Version or commit
      placeholder: abc1234
    validations:
      required: true

  - type: input
    id: component
    attributes:
      label: Component
      placeholder: Dashboard, auth, expenses, piggy bank, API, Prisma, Docker
    validations:
      required: true

  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use disposable/test data only.
      placeholder: |
        1. Open ...
        2. Submit ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or screenshots

  - type: checkboxes
    id: safety
    attributes:
      label: Safety checks
      options:
        - label: I removed secrets and personal financial data.
          required: true
        - label: I checked for an existing report.
          required: true
        - label: This is not an undisclosed security vulnerability.
          required: true
