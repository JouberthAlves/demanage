# Production stack. Runs immutable images published to GHCR by the
# "Publish verified GHCR images" workflow, referenced by digest.
#
# Required variables (set them in the production .env, never in this file):
#   DEMANAGE_BACKEND_IMAGE=ghcr.io/bielxdh3/demanage-backend@sha256:<digest>
#   DEMANAGE_FRONTEND_IMAGE=ghcr.io/bielxdh3/demanage-frontend@sha256:<digest>
#
# To build from source instead (self-host without GHCR), add the build override:
#   docker compose -f docker-compose.prod.yml -f docker-compose.build.yml up -d --build
# The build override still needs both variables set (any local tag works).
services:
  db:
    image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    container_name: demanage-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: demanage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: demanage
      TZ: UTC
    volumes:
      - demanage_pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U demanage -d demanage']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - demanage

  backend:
    image: ${DEMANAGE_BACKEND_IMAGE:?DEMANAGE_BACKEND_IMAGE is required (ghcr digest reference)}
    container_name: demanage-backend
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    environment:
      NODE_ENV: production
      TZ: UTC
      HOME: /tmp
      API_PORT: 8888
      APP_URL: ${APP_URL:-https://demanage.biel.dev.br}
      DATABASE_URL: postgresql://demanage:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/demanage?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8888/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - demanage

  # VITE_API_URL is compiled into the image at build time (CI uses /api). The
  # same value is used by the runtime CSP, so no runtime override is set here.
  frontend:
    image: ${DEMANAGE_FRONTEND_IMAGE:?DEMANAGE_FRONTEND_IMAGE is required (ghcr digest reference)}
    container_name: demanage-frontend
    restart: unless-stopped
    environment:
      PORT: 80
      TZ: UTC
      API_HOST: backend
      API_PORT: 8888
      NGINX_RESOLVER: 127.0.0.11
      NGINX_RESOLVER_IPV6: 'off'
      TRUST_CF_CONNECTING_IP: ${TRUST_CF_CONNECTING_IP:-0}
      APP_URL: ${APP_URL:-https://demanage.biel.dev.br}
    ports:
      - '127.0.0.1:${DEMANAGE_PORT:-8080}:80'
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - demanage

volumes:
  demanage_pgdata:
    name: demanage_pgdata

networks:
  demanage:
    driver: bridge
