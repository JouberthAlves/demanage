services:
  db:
    image: postgres:16-alpine
    container_name: demanage-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: demanage
      POSTGRES_PASSWORD: demanage
      POSTGRES_DB: demanage
    volumes:
      - demanage_pgdata:/var/lib/postgresql/data
  pgamdin:
    image: dpage/pgadmin4:latest
    container_name: demanage-pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: alvesjouberth81@gmail.com
      PGADMIN_DEFAULT_PASSWORD: demanage
    depends_on:
      - db
volumes:
  demanage_pgdata:
