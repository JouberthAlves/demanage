services:
  # Same PostgreSQL image digest as docker-compose.prod.yml and CI.
  # PostgreSQL 18 keeps PGDATA under /var/lib/postgresql/18/docker, so the volume
  # is mounted at /var/lib/postgresql. A volume created by PostgreSQL 16 (old
  # mount /var/lib/postgresql/data) is not compatible: back it up or remove it.
  db:
    image: postgres:18.6-alpine3.24@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    container_name: demanage-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: demanage
      POSTGRES_PASSWORD: demanage
      POSTGRES_DB: demanage
      TZ: UTC
    volumes:
      - demanage_pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U demanage -d demanage']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
  pgadmin:
    image: dpage/pgadmin4:9.18.0@sha256:c332c5f6dfba995d9ebc4af261d93506d6876085d712eaaa3defc8dd1a3f26de
    container_name: demanage-pgadmin
    restart: unless-stopped
    ports:
      - "127.0.0.1:5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.invalid
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-development-only-change-me}
      TZ: UTC
    depends_on:
      db:
        condition: service_healthy
volumes:
  demanage_pgdata:
