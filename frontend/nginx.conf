map "$APP_URL" $demanage_hsts {
  default "";
  "~^https://" "max-age=31536000; includeSubDomains";
}

# Cloudflare Tunnel terminates public HTTPS before reaching nginx over HTTP.
# Trust only the configured APP_URL, never an incoming forwarded-proto header.
map "$APP_URL" $demanage_public_proto {
  default $scheme;
  "~^https://" https;
}

server {
  listen ${PORT};
  server_name _;

  # Generated at boot; empty by default. A verified, exclusive tunnel socket
  # peer may opt into nginx's validated realip parser (never trust arbitrary CF
  # headers from any visitor or X-Forwarded-For supplied by a caller).
  include /etc/nginx/demanage-tunnel-realip.conf;

  root /usr/share/nginx/html;
  index index.html;

  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ${API_CSP_SOURCE}" always;
  add_header Strict-Transport-Security $demanage_hsts always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
  add_header X-Frame-Options DENY always;

  # Resolver DNS do container. O entrypoint usa NGINX_RESOLVER, ou o nameserver de
  # /etc/resolv.conf (127.0.0.11 no Docker Compose) e injeta o valor em runtime.
  resolver ${NGINX_RESOLVER} valid=10s ipv6=${NGINX_RESOLVER_IPV6};
  resolver_timeout 5s;

  # Browser chama /api/*; o rewrite remove o prefixo /api.
  # /api/auth/login → http://API_HOST:API_PORT/auth/login
  # OAuth discovery must be served at the public origin, not by the SPA.
  location ~ ^/\.well-known/oauth-(authorization-server|protected-resource)(/.*)?$ {
    set $oauth_upstream http://${API_HOST}:${API_PORT};
    proxy_pass $oauth_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $demanage_public_proto;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header X-Forwarded-Host $host;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
  }

  location /api/ {
    # `set` precisa vir ANTES do `rewrite ... break`, senão a variável não é definida.
    set $api_upstream http://${API_HOST}:${API_PORT};
    # Signed OAuth client JWTs must target the public token URL, not /oauth/token.
    rewrite ^/api/oauth/token$ /api/oauth/token break;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    # oidc-provider uses backend paths, while browsers reach OAuth through /api.
    proxy_cookie_path /oauth/consent /api/oauth/interaction/;
    proxy_cookie_path /oauth/auth/ /api/oauth/auth/;
    # After consent, oidc-provider resumes internally under /oauth/auth/:uid.
    # Repoint only that route; ChatGPT's external callback stays untouched.
    proxy_redirect $APP_URL/oauth/auth/ $APP_URL/api/oauth/auth/;
    proxy_redirect /oauth/auth/ $APP_URL/api/oauth/auth/;
    proxy_set_header X-Forwarded-Proto $demanage_public_proto;
    # Nginx overwrites XFF with its validated remote_addr. With realip disabled
    # this is the socket peer; with an exclusive tunnel peer, the CF visitor IP.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header X-Forwarded-Host $host;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
  }

  location / {
    try_files $uri /index.html;
  }
}
