server {
  listen ${PORT};
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Railway private DNS. nginx só re-resolve se proxy_pass usar variável.
  resolver [fd12::10] valid=1s ipv6=on;
  resolver_timeout 5s;

  # Browser chama /api/*; o rewrite remove o prefixo /api.
  # /api/auth/login → http://API_HOST:API_PORT/auth/login
  location /api/ {
    # `set` precisa vir ANTES do `rewrite ... break`, senão a variável não é definida.
    set $api_upstream http://${API_HOST}:${API_PORT};
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
  }

  location / {
    try_files $uri /index.html;
  }
}
