map "$TRUST_CF_CONNECTING_IP:$http_cf_connecting_ip" $demanage_client_ip {
  default $remote_addr;
  "~^1:(?<cf_client_ip>[^,[:space:]]+)$" $cf_client_ip;
}

map "$APP_URL" $demanage_hsts {
  default "";
  "~^https://" "max-age=31536000; includeSubDomains";
}

server {
  listen ${PORT};
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ${API_CSP_SOURCE}" always;
  add_header Strict-Transport-Security $demanage_hsts always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
  add_header X-Frame-Options DENY always;

  # Resolver DNS do container. O entrypoint usa NGINX_RESOLVER, ou o nameserver de
  # /etc/resolv.conf (127.0.0.11 no Docker Compose) e injeta o valor em runtime.
  resolver ${NGINX_RESOLVER} valid=10s ipv6=${NGINX_RESOLVER_IPV6};
  resolver_timeout 5s;

  # Browser chama /api/*; o rewrite remove o prefixo /api.
  # /api/auth/login → http://API_HOST:API_PORT/auth/login
  location /api/ {
    # `set` precisa vir ANTES do `rewrite ... break`, senão a variável não é definida.
    set $api_upstream http://${API_HOST}:${API_PORT};
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Trust Cloudflare's visitor IP only when the deployment explicitly enables
    # it and the Tunnel is the sole ingress. Otherwise use the direct peer.
    proxy_set_header X-Forwarded-For $demanage_client_ip;
    proxy_set_header X-Forwarded-Host $host;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
  }

  location / {
    try_files $uri /index.html;
  }
}
